<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Una pregunta importante</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Nunito:wght@400;600;800&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Collage con las fotos de la carpeta "memes" (se rellena al pulsar "No") -->
  <div id="collage" class="collage" aria-hidden="true"></div>

  <!-- Confeti de fondo (se activa al enviar el correo) -->
  <canvas id="confeti" class="confeti" aria-hidden="true"></canvas>

  <main class="contenido">

    <!-- PASO 1: la pregunta -->
    <section id="vista-pregunta" class="vista" hidden>
      <h1>¿Quieres volver a ser mi mujer para siempre?</h1>
      <div class="botones">
        <button id="btn-si" type="button" class="btn btn-si">Sí</button>
        <button id="btn-no" type="button" class="btn btn-no">No</button>
      </div>
    </section>

    <!-- PASO 2: formulario de correo -->
    <section id="vista-correo" class="vista" hidden>
      <h1>¡Sabía que dirías que sí!</h1>
      <p class="subtitulo">Déjanos tu correo para confirmar tu decisión.</p>
      <form id="form-correo" novalidate>
        <label for="correo">Correo electrónico</label>
        <input id="correo" name="email" type="email" placeholder="tucorreo@ejemplo.com"
               autocomplete="email" required>
        <p id="error-correo" class="error" role="alert" hidden></p>
        <button id="btn-okay" type="submit" class="btn btn-si">Okay</button>
      </form>
    </section>

    <!-- PASO 3: agradecimiento -->
    <section id="vista-gracias" class="vista" hidden>
      <h1>Muchas gracias por su confianza, haremos todo lo posible para que actualice con el equipo todos los años</h1>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
